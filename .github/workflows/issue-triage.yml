name: Issue triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  triage:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          HAS_PAT: ${{ secrets.ISSUES_TOKEN != '' }}
        with:
          github-token: ${{ secrets.ISSUES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issue_number = issue.number;
            const labels = (issue.labels || []).map(l => l.name);
            const canComment = process.env.HAS_PAT === "true";

            if (context.eventName === "issue_comment") {
              const fromAuthor = context.payload.comment.user.login === issue.user.login;
              if (fromAuthor && labels.includes("needs-info")) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "needs-info" }).catch(() => {});
              }
              return;
            }

            if (!labels.includes("bug")) return;
            if (["OWNER", "MEMBER", "COLLABORATOR"].includes(issue.author_association)) return;

            const body = issue.body || "";
            const m = body.match(/^###\s+What happened\?\s*$([\s\S]*?)(?=^###\s|$(?![\s\S]))/m);
            if (!m) return;
            const happened = m[1].replace(/_No response_/g, "").replace(/\s+/g, " ").trim();
            const vague = /^(not working|doesn'?t work|broken|bug|crash(es)?|same( issue)?|help|see (title|screenshot|video))\.?$/i;
            if (happened.length >= 8 && !vague.test(happened)) return;

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ["needs-info"] });
            if (!canComment) return;
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().slice(0, 19) + "Z";
            const recent = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue author:${issue.user.login} label:needs-info created:>=${since}`,
              per_page: 10,
            });
            if (recent.data.items.some(i => i.number !== issue_number)) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body:
                "<!-- arc:needs-info -->\n" +
                "Thanks for this. Could you add a bit more about what happened, what you were playing and roughly " +
                "when it goes wrong? I can't track it down from this alone. A photo of any error on screen helps a lot.",
            });
